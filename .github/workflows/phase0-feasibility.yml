name: Phase 0 - Feasibility & Emulator Boot Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/phase0-feasibility.yml'
      - 'scripts/phase0-benchmark.sh'

jobs:
  phase0-verification:
    name: 🧪 Pha 0 - Kiểm tra khả thi & Boot Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Tải mã nguồn dự án
        uses: actions/checkout@v4

      - name: 🔑 Kiểm tra và kích hoạt KVM Hardware Acceleration
        run: |
          echo "=== 1. Kiểm tra /dev/kvm trên GitHub Runner ==="
          if [ ! -e /dev/kvm ]; then
            echo "::error::Runner không tồn tại /dev/kvm!"
            exit 1
          fi
          ls -la /dev/kvm
          
          echo "=== 2. Thiết lập udev rule mode 0666 cho /dev/kvm ==="
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          
          python3 -c "import os; assert os.access('/dev/kvm', os.R_OK | os.W_OK), 'KVM không đọc ghi được'"
          echo "✅ KVM Hardware Virtualization sẵn sàng và có quyền đọc/ghi!"

      - name: ☕ Thiết lập Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 Cài đặt thư viện đồ họa & cpu-checker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libpulse0 libnss3 libgl1 libegl1 libvulkan1 cpu-checker
          chmod +x scripts/*.sh
          kvm-ok || true

      - name: 🔍 Kiểm tra danh sách thiết bị trong avdmanager
        run: |
          mkdir -p artifacts
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "=== Tra cứu danh sách thiết bị (avdmanager list device) ==="
          avdmanager list device > artifacts/avdmanager_devices.txt || true
          grep -E "id:|Name:" artifacts/avdmanager_devices.txt | head -25 || true
          
          echo "Kiểm tra xem có Pixel 10 Pro không:"
          if grep -qi "Pixel 10" artifacts/avdmanager_devices.txt; then
            echo "Tìm thấy Pixel 10 trong SDK!"
          else
            echo "Xác nhận: Pixel 10 Pro chưa có sẵn trong SDK (profile mới nhất của SDK hiện tại là Pixel 7 Pro / Pixel 8). Sẽ dùng profile pixel_7_pro cơ sở và tinh chỉnh thông số chuẩn Pixel 10 Pro."
          fi

      - name: 📱 Khởi chạy Emulator & Đo đạc thời gian Boot thực tế
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          cores: 3
          disk-size: 16G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/phase0-benchmark.sh

      - name: 📤 Lưu Artifacts Pha 0 lên GitHub Actions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase0-feasibility-artifacts
          path: artifacts/
          retention-days: 14
