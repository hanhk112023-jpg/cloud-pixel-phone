<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cloud Phone — Google Pixel 10 Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090E;
      --surface: rgba(15, 23, 42, 0.85);
      --surface-border: rgba(255, 255, 255, 0.12);
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --green: #10B981;
      --red: #EF4444;
      --text: #F8FAFC;
      --text-dim: #94A3B8;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    /* BACKGROUND AMBIENT GLOW */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.08) 0%, rgba(7, 9, 14, 0.95) 75%);
      z-index: 1;
    }

    /* FIXED FULLSCREEN PHONE VIEWPORT (UGPHONE STYLE) */
    .phone-viewport {
      position: relative;
      height: 100vh;
      width: calc(100vh * (1080 / 2400));
      max-width: 100vw;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
      z-index: 2;
      overflow: hidden;
    }

    @media (max-aspect-ratio: 1080/2400) {
      .phone-viewport {
        width: 100vw;
        height: calc(100vw * (2400 / 1080));
        max-height: 100vh;
      }
    }

    /* SCRCPY LOW-LATENCY 60FPS IFRAME */
    #scrcpyFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      display: block;
    }

    /* CANVAS DISPLAY (FALLBACK) */
    #screenCanvas {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: none;
      cursor: pointer;
      background: #000;
      touch-action: none;
    }

    /* STATUS PILL (TINY CORNER BADGE) */
    .status-pill {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 4px 10px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .status-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    /* TOUCH RIPPLE FEEDBACK */
    .touch-ripple {
      position: fixed;
      width: 36px;
      height: 36px;
      margin-left: -18px;
      margin-top: -18px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.45);
      border: 2px solid #38BDF8;
      pointer-events: none;
      animation: rippleAnim 0.35s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      z-index: 999999;
    }
    @keyframes rippleAnim {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    /* =========================================================================
       FLOATING BUBBLE (BÓNG NỔI - ASSISTIVETOUCH UGPHONE STYLE)
       ========================================================================= */
    .floating-bubble {
      position: fixed;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 16px var(--accent-glow);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      z-index: 99999;
      touch-action: none;
      transition: transform 0.15s, opacity 0.2s;
      right: 18px;
      top: 45%;
    }

    .floating-bubble:active {
      cursor: grabbing;
      transform: scale(0.92);
    }

    .floating-bubble svg {
      width: 24px;
      height: 24px;
      fill: #38BDF8;
      pointer-events: none;
      filter: drop-shadow(0 0 4px var(--accent-glow));
    }

    /* PULSING RING */
    .floating-bubble::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      opacity: 0.4;
      animation: bubblePulse 2.5s infinite;
      pointer-events: none;
    }
    @keyframes bubblePulse {
      0% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* FLOATING MENU MODAL */
    .floating-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 99998;
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .floating-menu-backdrop.show {
      display: block;
      opacity: 1;
    }

    .floating-menu-panel {
      position: fixed;
      width: 320px;
      max-width: 90vw;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.15);
      padding: 18px;
      z-index: 100000;
      display: none;
      flex-direction: column;
      gap: 14px;
      transform: scale(0.92);
      opacity: 0;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }

    .floating-menu-panel.show {
      display: flex;
      transform: scale(1);
      opacity: 1;
    }

    /* MENU HEADER */
    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .menu-title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38BDF8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 600;
    }

    .btn-close-menu {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* GRID TOOLS */
    .menu-section-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .menu-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
    }

    .menu-btn:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: #fff;
    }

    .menu-btn:active {
      transform: scale(0.94);
    }

    .menu-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .menu-btn.primary {
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--accent);
      color: #38BDF8;
    }

    /* MODAL POPUPS (TEXT & APK) */
    .modal-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: 380px;
      max-width: 90vw;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      padding: 20px;
      z-index: 100005;
      display: none;
      opacity: 0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      flex-direction: column;
      gap: 14px;
    }

    .modal-dialog.show {
      display: flex;
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .modal-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .modal-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-dialog {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-dialog:active {
      transform: scale(0.96);
    }

    .btn-dialog.cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
    }

    .btn-dialog.submit {
      background: var(--accent);
      color: #07090E;
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 100010;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- AMBIENT GLOW -->
  <div class="ambient-glow"></div>

  <!-- FIXED FULLSCREEN PHONE VIEWPORT -->
  <div class="phone-viewport" id="viewport">
    <!-- ENGINE 1: SCRCPY ULTRA-LOW LATENCY H.264 (SUB-50MS) -->
    <iframe id="scrcpyFrame" src="/scrcpy/" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    
    <!-- ENGINE 2: CANVAS TURBO JPEG STREAM (FALLBACK) -->
    <canvas id="screenCanvas" width="1080" height="2400"></canvas>
    
    <!-- TINY STATUS PILL -->
    <div class="status-pill">
      <span class="dot"></span>
      <span id="pillFps">60 FPS · Scrcpy</span>
    </div>
  </div>

  <!-- FLOATING BUBBLE (BÓNG NỔI ASSISTIVE TOUCH) -->
  <div class="floating-bubble" id="floatingBubble" title="Mở thanh công cụ Cloud Phone">
    <svg viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
    </svg>
  </div>

  <!-- FLOATING MENU BACKDROP -->
  <div class="floating-menu-backdrop" id="menuBackdrop" onclick="closeMenu()"></div>

  <!-- FLOATING MENU PANEL -->
  <div class="floating-menu-panel" id="menuPanel">
    <div class="menu-header">
      <div class="menu-title">
        <span>Pixel 10 Pro</span>
        <span class="menu-badge">UG Style</span>
      </div>
      <button class="btn-close-menu" onclick="closeMenu()">✕</button>
    </div>

    <!-- ENGINE SELECTOR -->
    <div>
      <div class="menu-section-title">Chế Độ Điều Khiển (Độ Trễ)</div>
      <div class="menu-grid" style="grid-template-columns: 1fr 1fr;">
        <button class="menu-btn primary" id="btnModeScrcpy" onclick="switchEngine('scrcpy')">
          <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
          ⚡ Siêu Tốc (Scrcpy 60fps)
        </button>
        <button class="menu-btn" id="btnModeCanvas" onclick="switchEngine('canvas')">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          📷 Canvas Turbo
        </button>
      </div>
      <div style="margin-top: 8px;">
        <a href="/scrcpy/" target="_blank" class="menu-btn" style="text-decoration: none; width: 100%; display: flex; flex-direction: row; gap: 8px; justify-content: center; padding: 10px; background: rgba(56, 189, 248, 0.15); border-color: var(--accent); color: #38BDF8;">
          <svg viewBox="0 0 24 24" style="width: 18px; height: 18px;"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
          🚀 Mở Scrcpy Full Màn Hình Tab Mới
        </a>
      </div>
    </div>

    <!-- CORE NAVIGATION -->
    <div>
      <div class="menu-section-title">Phím Điều Hướng Cốt Lõi</div>
      <div class="menu-grid">
        <button class="menu-btn primary" onclick="execKey('BACK')">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          Quay lại
        </button>
        <button class="menu-btn primary" onclick="execKey('HOME')">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          Home
        </button>
        <button class="menu-btn primary" onclick="execKey('RECENTS')">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6z"/></svg>
          Đa nhiệm
        </button>
        <button class="menu-btn" onclick="execKey('NOTIFICATIONS')">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          Thông báo
        </button>
      </div>
    </div>

    <!-- FAST APPS & ACTIONS -->
    <div>
      <div class="menu-section-title">Ứng Dụng & Cài Đặt</div>
      <div class="menu-grid">
        <button class="menu-btn" style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: #34D399;" onclick="execLaunch('chplay')">

          CH Play
        </button>
        <button class="menu-btn" onclick="execLaunch('chrome')">

          Chrome
        </button>

          <svg viewBox="0 0 24 24"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 21c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73z"/></svg>
          YouTube
        </button>
        <button class="menu-btn" onclick="execLaunch('settings')">

          Cài đặt
        </button>
      </div>
    </div>

    <!-- PRO TOOLS -->
    <div>
      <div class="menu-section-title">Công Cụ Tiện Ích</div>
      <div class="menu-grid">
        <button class="menu-btn" onclick="openTextDialog()">
          <svg viewBox="0 0 24 24"><path d="M2.5 4v3h5v12h3V7h5V4h-13zm19 5h-9v3h3v7h3v-7h3V9z"/></svg>
          Gửi Chữ
        </button>
        <button class="menu-btn" onclick="openApkDialog()">
          <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
          Cài APK
        </button>
        <button class="menu-btn" onclick="downloadScreenshot()">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          Chụp HD
        </button>
        <button class="menu-btn" onclick="execKey('POWER')">
          <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7.92 7.92 0 0 1 20 12c0 4.42-3.58 8-8 8s-8-3.58-8-8c0-2.59 1.23-4.9 3.14-6.38L5.72 4.2C3.43 6.01 2 8.84 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-3.16-1.43-5.99-3.72-7.83h-.45z"/></svg>
          Nguồn
        </button>
      </div>
    </div>
  </div>

  <!-- TEXT INPUT MODAL -->
  <div class="modal-dialog" id="textDialog">
    <div class="modal-header">
      <div class="modal-title">⌨️ Gửi Văn Bản Vào Điện Thoại</div>
      <button class="btn-close-menu" onclick="closeDialog('textDialog')">✕</button>
    </div>
    <input type="text" id="phoneTextInput" class="modal-input" placeholder="Nhập chữ, link tải hoặc văn bản..." onkeydown="if(event.key==='Enter') submitText()">
    <div class="modal-actions">
      <button class="btn-dialog cancel" onclick="closeDialog('textDialog')">Hủy</button>
      <button class="btn-dialog submit" onclick="submitText()">Gửi Ngay</button>
    </div>
  </div>

  <!-- APK INSTALL MODAL -->
  <div class="modal-dialog" id="apkDialog">
    <div class="modal-header">
      <div class="modal-title">📦 Cài Đặt File APK</div>
      <button class="btn-close-menu" onclick="closeDialog('apkDialog')">✕</button>
    </div>
    <p style="font-size: 12px; color: var(--text-dim);">Chọn file .apk từ máy tính để tự động cài đặt qua ADB:</p>
    <input type="file" id="apkFileInput" accept=".apk" style="display: none;" onchange="uploadApkFile(this.files[0])">
    <button class="btn-dialog submit" style="width: 100%; padding: 14px; text-align: center;" onclick="document.getElementById('apkFileInput').click()">
      📁 Chọn file .APK từ máy tính
    </button>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    // =========================================================================
    // DUAL ENGINE STREAMING CONTROLLER (SCRCPY 60FPS & CANVAS TURBO)
    // =========================================================================
    let currentEngine = 'scrcpy';
    const iframe = document.getElementById('scrcpyFrame');
    const canvas = document.getElementById('screenCanvas');
    const ctx = canvas.getContext('2d');
    let isFetching = false;
    let frameCount = 0;
    let lastFpsTime = Date.now();
    let lastSavedTime = 0;

    function switchEngine(engine) {
      currentEngine = engine;
      const btnScrcpy = document.getElementById('btnModeScrcpy');
      const btnCanvas = document.getElementById('btnModeCanvas');
      const pillFps = document.getElementById('pillFps');

      if (engine === 'scrcpy') {
        iframe.style.display = 'block';
        canvas.style.display = 'none';
        btnScrcpy.classList.add('primary');
        btnCanvas.classList.remove('primary');
        pillFps.textContent = '60 FPS · Scrcpy';
        showToast('⚡ Chế độ Siêu Tốc Scrcpy (Sub-50ms)');
      } else {
        iframe.style.display = 'none';
        canvas.style.display = 'block';
        btnCanvas.classList.add('primary');
        btnScrcpy.classList.remove('primary');
        pillFps.textContent = 'Canvas Turbo';
        showToast('📷 Chế độ Canvas Turbo (Tiết kiệm băng thông)');
        fetchNextFrame();
      }
      closeMenu();
    }

    // 0ms RELOAD CACHE: Hiển thị ngay frame trước đó từ sessionStorage khi vừa load trang
    const cachedData = sessionStorage.getItem('pixel_last_screen');
    if (cachedData) {
      const initImg = new Image();
      initImg.onload = () => ctx.drawImage(initImg, 0, 0, canvas.width, canvas.height);
      initImg.src = cachedData;
    }

    // Tải khung hình liên tục bằng kỹ thuật double-buffering không nghẽn
    function fetchNextFrame() {
      if (currentEngine !== 'canvas' || isFetching) return;
      isFetching = true;

      const img = new Image();
      let finished = false;

      // Hủy cờ fetching sau 350ms nếu mạng chậm để không bao giờ bị nghẽn chu kỳ
      const watchdog = setTimeout(() => {
        if (!finished) isFetching = false;
      }, 350);

      img.onload = () => {
        finished = true;
        clearTimeout(watchdog);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        isFetching = false;

        const now = Date.now();
        if (now - lastSavedTime > 1500) {
          try {
            sessionStorage.setItem('pixel_last_screen', canvas.toDataURL('image/jpeg', 0.5));
            lastSavedTime = now;
          } catch(e) {}
        }

        frameCount++;
        if (now - lastFpsTime >= 2000) {
          const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
          document.getElementById('pillFps').textContent = `${fps} FPS · KVM`;
          frameCount = 0;
          lastFpsTime = now;
        }
      };
      img.onerror = () => {
        finished = true;
        clearTimeout(watchdog);
        isFetching = false;
      };
      img.src = '/api/screenshot?t=' + Date.now();
    }

    setInterval(() => {
      if (currentEngine === 'canvas') fetchNextFrame();
    }, 120);

    // =========================================================================
    // CANVAS TOUCH & GESTURE (NON-BLOCKING FIRE-AND-FORGET)
    // =========================================================================
    let startX = 0, startY = 0, startTime = 0;
    let isDragging = false;

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      startX = Math.max(0, Math.min(1080, Math.round((e.clientX - rect.left) * (1080 / rect.width))));
      startY = Math.max(0, Math.min(2400, Math.round((e.clientY - rect.top) * (2400 / rect.height))));
      startTime = Date.now();
      isDragging = true;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const rect = canvas.getBoundingClientRect();
      const endX = Math.max(0, Math.min(1080, Math.round((e.clientX - rect.left) * (1080 / rect.width))));
      const endY = Math.max(0, Math.min(2400, Math.round((e.clientY - rect.top) * (2400 / rect.height))));
      const elapsed = Date.now() - startTime;
      const dist = Math.hypot(endX - startX, endY - startY);

      if (dist < 20) {
        showTouchFeedback(e.clientX, e.clientY);
        // Bắn lệnh bất đồng bộ tức thì — KHÔNG AWAIT để không chặn thread (0ms lag)
        fetch('/api/tap', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ x: startX, y: startY })
        }).catch(() => {});
      } else {
        fetch('/api/swipe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            x1: startX,
            y1: startY,
            x2: endX,
            y2: endY,
            duration: Math.min(Math.max(elapsed, 80), 300)
          })
        }).catch(() => {});
      }

      // Kích hoạt ngay lập tức 2 frame phản hồi
      isFetching = false;
      setTimeout(fetchNextFrame, 70);
      setTimeout(fetchNextFrame, 220);
    });

    function showTouchFeedback(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'touch-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 350);
    }

    // =========================================================================
    // FLOATING BUBBLE DRAG & AUTO SNAP (ASSISTIVETOUCH UGPHONE STYLE)
    // =========================================================================
    const bubble = document.getElementById('floatingBubble');
    const menuPanel = document.getElementById('menuPanel');
    const menuBackdrop = document.getElementById('menuBackdrop');
    let isBubbleDragging = false;
    let bubbleMoved = false;
    let bStartX, bStartY, initialX, initialY;

    bubble.addEventListener('pointerdown', (e) => {
      isBubbleDragging = true;
      bubbleMoved = false;
      bStartX = e.clientX;
      bStartY = e.clientY;
      const rect = bubble.getBoundingClientRect();
      initialX = rect.left;
      initialY = rect.top;
      bubble.setPointerCapture(e.pointerId);
    });

    bubble.addEventListener('pointermove', (e) => {
      if (!isBubbleDragging) return;
      const dx = e.clientX - bStartX;
      const dy = e.clientY - bStartY;
      if (Math.hypot(dx, dy) > 6) {
        bubbleMoved = true;
        bubble.style.right = 'auto';
        bubble.style.left = `${Math.max(10, Math.min(window.innerWidth - 58, initialX + dx))}px`;
        bubble.style.top = `${Math.max(10, Math.min(window.innerHeight - 58, initialY + dy))}px`;
      }
    });

    bubble.addEventListener('pointerup', (e) => {
      if (!isBubbleDragging) return;
      isBubbleDragging = false;
      if (!bubbleMoved) {
        toggleMenu();
      } else {
        // Hút nam châm thông minh vào cạnh trái hoặc phải màn hình giống AssistiveTouch / UGPhone
        const curLeft = parseFloat(bubble.style.left) || 0;
        const screenW = window.innerWidth;
        bubble.style.transition = 'left 0.25s cubic-bezier(0.16, 1, 0.3, 1), top 0.25s cubic-bezier(0.16, 1, 0.3, 1)';
        if (curLeft < screenW / 2) {
          bubble.style.left = '16px';
        } else {
          bubble.style.left = `${screenW - 48 - 16}px`;
        }
        setTimeout(() => {
          bubble.style.transition = 'transform 0.15s, opacity 0.2s';
        }, 260);
      }
    });

    function toggleMenu() {
      if (menuPanel.classList.contains('show')) {
        closeMenu();
      } else {
        openMenu();
      }
    }

    function openMenu() {
      const bRect = bubble.getBoundingClientRect();
      const menuWidth = 320;
      let left = bRect.left - menuWidth - 12;
      if (left < 10) left = bRect.right + 12;
      if (left + menuWidth > window.innerWidth - 10) {
        left = Math.max(10, window.innerWidth / 2 - menuWidth / 2);
      }
      let top = Math.max(20, Math.min(window.innerHeight - 440, bRect.top - 60));

      menuPanel.style.left = `${left}px`;
      menuPanel.style.top = `${top}px`;
      menuPanel.classList.add('show');
      menuBackdrop.classList.add('show');
    }

    function closeMenu() {
      menuPanel.classList.remove('show');
      menuBackdrop.classList.remove('show');
    }

    // =========================================================================
    // API SHORTCUT ACTIONS
    // =========================================================================
    async function execKey(keyName) {
      closeMenu();
      showToast(`Đã bấm ${keyName}`);
      fetch('/api/key', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: keyName })
      }).catch(() => {});
      if (currentEngine === 'canvas') {
        setTimeout(fetchNextFrame, 120);
        setTimeout(fetchNextFrame, 350);
      }
    }

    async function execLaunch(appName) {
      closeMenu();
      showToast(`Đang mở ${appName.toUpperCase()}...`);
      fetch(`/api/launch?app=${appName}`).catch(() => {});
      if (currentEngine === 'canvas') {
        setTimeout(fetchNextFrame, 200);
        setTimeout(fetchNextFrame, 600);
      }
    }

    // TEXT MODAL
    function openTextDialog() {
      closeMenu();
      document.getElementById('textDialog').classList.add('show');
      menuBackdrop.classList.add('show');
      setTimeout(() => document.getElementById('phoneTextInput').focus(), 100);
    }

    async function submitText() {
      const input = document.getElementById('phoneTextInput');
      const text = input.value.trim();
      if (!text) return;
      closeDialog('textDialog');
      showToast(`Đã gửi: "${text}"`);
      fetch('/api/text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      }).catch(() => {});
      input.value = '';
    }

    // APK MODAL
    function openApkDialog() {
      closeMenu();
      document.getElementById('apkDialog').classList.add('show');
      menuBackdrop.classList.add('show');
    }

    async function uploadApkFile(file) {
      if (!file || !file.name.endsWith('.apk')) {
        showToast('Vui lòng chọn file .apk hợp lệ');
        return;
      }
      closeDialog('apkDialog');
      showToast(`Đang cài đặt ${file.name}...`);

      const formData = new FormData();
      formData.append('apk', file);
      try {
        const resp = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await resp.json();
        if (data.success) {
          showToast(`Cài đặt thành công ${file.name}!`);
        } else {
          showToast(`Lỗi cài: ${data.error}`);
        }
      } catch (err) {
        showToast(`Lỗi kết nối: ${err.message}`);
      }
    }

    function closeDialog(id) {
      document.getElementById(id).classList.remove('show');
      menuBackdrop.classList.remove('show');
    }

    // HD SCREENSHOT
    async function downloadScreenshot() {
      closeMenu();
      showToast('Đang tải ảnh chụp màn hình HD...');
      const resp = await fetch('/api/screenshot?hd=1');
      if (resp.ok) {
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `pixel10_screenshot_${Date.now()}.png`;
        a.click();
        URL.revokeObjectURL(url);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    // DRAG AND DROP APK TRỰC TIẾP LÊN MÀN HÌNH
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files.length > 0) {
        uploadApkFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
