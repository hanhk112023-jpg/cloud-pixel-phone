server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/runner/work/cloud-pixel-phone/cloud-pixel-phone/server;
    index index.html;

    # Giao diện điều khiển Pixel 10 Pro
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST Điều Khiển Thiết Bị (Python Server)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500M;
    }

    # Luồng phát Scrcpy Web & WebSocket (Port 8000)
    location /scrcpy/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Hỗ trợ trực tiếp cho các route nội bộ của ws-scrcpy
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
